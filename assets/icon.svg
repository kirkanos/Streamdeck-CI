    <rect x="188" y="372" width="30" height="48" rx="8"/>
    <rect x="234" y="372" width="30" height="48" rx="8" fill="#EF4444"/>
    <rect x="280" y="372" width="30" height="48" rx="8"/>
    <rect x="326" y="372" width="30" height="48" rx="8"/>
    <rect x="372" y="372" width="30" height="48" rx="8" fill="#F59E0B"/>
