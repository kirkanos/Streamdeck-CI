<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Dial settings</title>
    <script src="sdpi-components.js"></script>
    <script src="connection.js"></script>
    <link rel="stylesheet" href="pi.css" />
  </head>
  <body>
    <div id="ci-connection"></div>

    <div class="requires-setup" hidden>
      <sdpi-item label="Repo">
        <sdpi-select setting="repoKey" datasource="getRepos" hot-reload placeholder="Select a repo" loading="Loading repos…"></sdpi-select>
      </sdpi-item>

      <p class="hint">
        Turn the dial to browse all repos; the touch strip shows the last run of the selected one. Push the dial to
        restart that run, tap the touch strip to open it in the browser.
      </p>
    </div>
  </body>
</html>
